name: Unit Tests On Matrix

on:
  pull_request:
  workflow_dispatch:

jobs:
  matrix-tests:
    strategy:
      matrix:
        platform: [ubuntu-latest, windows-latest, macos-latest]
        configuration: [Debug, Release]
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Run dotnet tests (${{ matrix.platform }} / ${{ matrix.configuration }})
        uses: dusrdev/actions/.github/workflows/reusable-dotnet-test-mtp.yaml@main
        with:
          platform: ${{ matrix.platform }}
          dotnet-version: 9.0.x
          configuration: ${{ matrix.configuration }}
          test-project-path: tests/ArrowDbCore.Tests.Unit/ArrowDbCore.Tests.Unit.csproj

  matrix-tests-isolated:
    strategy:
      matrix:
        platform: [ubuntu-latest, windows-latest, macos-latest]
        configuration: [Debug, Release]
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Run dotnet tests - Isolated (${{ matrix.platform }} / ${{ matrix.configuration }})
        uses: dusrdev/actions/.github/workflows/reusable-dotnet-test-mtp.yaml@main
        with:
          platform: ${{ matrix.platform }}
          dotnet-version: 9.0.x
          configuration: ${{ matrix.configuration }}
          test-project-path: tests/ArrowDbCore.Tests.Unit.Isolated/ArrowDbCore.Tests.Unit.Isolated.csproj